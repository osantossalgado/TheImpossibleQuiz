<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Quiz</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player {
            width: 800px;
            height: 600px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <!-- Load self-hosted Ruffle from the ruffle folder -->
    <script src="ruffle/ruffle.js"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "ruffle/", // Points Ruffle to your self-hosted .wasm files
            autoplay: "on",
            unmuteOverlay: "hidden",
            volume: 0, // Sets the audio volume to 0 (completely muted)
        };

        window.addEventListener("DOMContentLoaded", () => {
            let ruffle = window.RufflePlayer.newest();
            let player = ruffle.createPlayer();
            
            // Style or append the player to the body
            player.id = "player";
            document.body.appendChild(player);
            
            // Load your SWF file from the root directory
            player.load("the-impossible-quiz.swf");
        });
    </script>

</body>
</html>
